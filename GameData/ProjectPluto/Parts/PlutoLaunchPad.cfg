PART
{
    name = projectPlutoLaunchPad
    module = Part
    author = Project Pluto mod

    MODEL
    {
        model = ProjectPluto/Parts/Assets/PlutoLaunchPad
    }
    rescaleFactor = 1
    // Surface-attaches by the top of its cradle; the part hangs below the missile's belly.
    node_attach = 0, 0, 0, 0, -1, 0
    attachRules = 0,1,0,0,0
    bulkheadProfiles = srf

    TechRequired = nuclearPropulsion
    entryCost = 4000
    cost = 1500
    category = Structural
    subcategory = 0
    title = Project Pluto Launcher
    manufacturer = Livermore / Ling-Temco-Vought (depiction)
    description = A ground launcher for the SLAM. Attach it under the missile's belly (the side with the air scoop): the craft tilts to the launch elevation set in its menu, and on the launch pad a tower reaches down to the ground and holds the missile still. Stage it together with the boosters and the missile slides off the cradle; the launcher stays behind.
    tags = pluto slam launcher launch pad clamp ramp rail

    mass = 2
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 2
    crashTolerance = 100
    breakingForce = 5000
    breakingTorque = 5000
    rigidAttachment = True
    maxTemp = 3000
    fuelCrossFeed = False
    explosionPotential = 0
    stagingIcon = DECOUPLER_VERT
    stageOffset = 0
    childStageOffset = 0
    preferredStage = LAST

    MODULE
    {
        name = ModulePlutoLaunchPad
    }

    // Ground power while the missile waits on the pad.
    MODULE
    {
        name = ModuleGenerator
        isAlwaysActive = true
        isGroundFixture = true
        OUTPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 1
        }
    }
}
