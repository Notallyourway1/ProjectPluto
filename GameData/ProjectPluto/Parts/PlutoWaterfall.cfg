// Optional: only applied when Waterfall and Stock Waterfall Effects (which provides the template) are both
// installed. Replaces the ramjet's stock exhaust particles
// with Waterfall's jet-exhaust template, sized for Pluto's 1 m nozzle. The boosters keep stock effects.
@PART[projectPlutoSLAM]:NEEDS[Waterfall&StockWaterfallEffects]:AFTER[ProjectPluto]
{
    @EFFECTS
    {
        @ramjetRunning
        {
            !MODEL_MULTI_PARTICLE {}
        }
    }

    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = plutoRamjetFX
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = Ramjet
            responseRateUp = 0.05
            responseRateDown = 0.05
        }
        CONTROLLER
        {
            name = mach
            linkedTo = mach
        }
        TEMPLATE
        {
            templateName = stock-kerozine-turbofan-1
            overrideParentTransform = ramjetThrust
            position = 0,0,0
            rotation = 0, 0, 0
            scale = 0.55, 0.55, 0.55
        }
    }
}
