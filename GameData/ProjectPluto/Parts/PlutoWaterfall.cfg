// Optional: only applied when Waterfall and Stock Waterfall Effects (which provides the template) are both
// installed. Replaces the ramjet's stock exhaust particles with the afterburning-ramjet plume Stock
// Waterfall Effects gives the Whiplash: heat shimmer and shock diamonds that grow with speed and fade in
// thin air. Sized for Pluto's 1 m nozzle. The boosters keep stock effects.
@PART[projectPlutoSLAM]:NEEDS[Waterfall&StockWaterfallEffects]:AFTER[ProjectPluto]
{
    @EFFECTS
    {
        @ramjetRunning
        {
            !MODEL_MULTI_PARTICLE {}
        }
    }

    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = plutoRamjetFX
        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = throttle
            linkedTo = throttle
            engineID = Ramjet
            responseRateUp = 0.05
            responseRateDown = 0.05
        }
        CONTROLLER
        {
            name = mach
            linkedTo = mach
        }
        // Flicker for the shock diamonds (the template expects these four noise controllers).
        CONTROLLER
        {
            name = R1
            linkedTo = random
            noiseType = perlin
            scale = 1
            minimum = 0
            speed = 4
            seed = 3
        }
        CONTROLLER
        {
            name = R2
            linkedTo = random
            noiseType = perlin
            scale = 1
            minimum = 0
            speed = 4
            seed = 13
        }
        CONTROLLER
        {
            name = R3
            linkedTo = random
            noiseType = perlin
            scale = 1
            minimum = 0
            speed = 4
            seed = 29
        }
        CONTROLLER
        {
            name = R4
            linkedTo = random
            noiseType = perlin
            scale = 1
            minimum = 0
            speed = 4
            seed = 41
        }
        TEMPLATE
        {
            templateName = stock-kerozine-afterburner-2
            overrideParentTransform = ramjetThrust
            position = 0,0,0
            rotation = 0, 0, 0
            scale = 1.1, 1.1, 1.1
        }
    }
}
