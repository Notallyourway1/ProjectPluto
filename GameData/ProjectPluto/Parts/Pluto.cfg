PART
{
    name = projectPlutoSLAM
    module = Part
    author = Project Pluto mod

    MODEL
    {
        model = ProjectPluto/Parts/Assets/PlutoExterior
    }
    rescaleFactor = 1
    node_stack_bottom = 0, -13.45, 0, 0, -1, 0, 1
    node_attach = 0, 0, 0.75, 0, 0, 1, 1
    attachRules = 1,1,1,1,0
    bulkheadProfiles = size1, srf

    TechRequired = nuclearPropulsion
    entryCost = 40000
    cost = 45000
    // A probe core of its own: it flies without any other command part.
    category = Pods
    subcategory = 0
    title = Project Pluto SLAM
    manufacturer = Livermore / Ling-Temco-Vought (depiction)
    description = SLAM, the Supersonic Low Altitude Missile, was the U.S. Air Force cruise missile of Project Pluto (1957–1964). A 600 MW unshielded reactor heated rammed air to push it at Mach 3 at tree-top height or Mach 4.2 at altitude, for a range of 182,000 km. Only the engine was built: Tory II-C ran at full power for 292 seconds in Nevada on 20 May 1964, and the project was cancelled on 1 July 1964. This part depicts the missile as it might have flown; booster count, reactor timing, radiation and warhead effects are gameplay choices.
    tags = pluto slam nuclear ramjet missile tory

    // 19.5 t missile + 8 t warheads (16 × 0.5 t) + 3 t empty boosters. Real launch mass: 27.5 t without boosters.
    mass = 30.5
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    // The two drag cubes, written out so KSP does not generate its own. Generated, the three canards
    // (each a multi-cube control surface) add nine cubes of the missile with its boosters on, which
    // kept about three quarters of the booster drag after the boosters were thrown off.
    // If the model changes: remove this block, start KSP once, and copy the Boosted and Clean lines
    // for projectPlutoSLAM from PartDatabase.cfg back here.
    DRAG_CUBE
    {
        cube = Boosted, 46.58,0.7342,2.709, 46.58,0.7341,2.709, 3.823,0.1167,24.45, 3.823,0.5239,22.54, 45.71,0.7549,2.148, 45.71,0.7947,3.461, -1.192E-07,0.65,-0.38, 3.937,28.4,3.74
        cube = Clean, 41.88,0.7175,2.709, 41.88,0.7173,2.709, 2.946,0.08312,24.45, 2.946,0.4973,22.44, 39.75,0.7739,1.427, 39.75,0.7806,3.418, -1.192E-07,0.715,-0.455, 3.937,28.27,3.59
    }
    crashTolerance = 12
    breakingForce = 2000
    breakingTorque = 2000
    maxTemp = 2000
    skinMaxTemp = 2400
    emissiveConstant = 0.9
    explosionPotential = 0.4
    vesselType = Probe

    RESOURCE
    {
        name = SolidFuel
        amount = 1700
        maxAmount = 1700
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 200
        maxAmount = 200
    }
    RESOURCE
    {
        name = IntakeAir
        amount = 10
        maxAmount = 10
    }

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        hasHibernation = True
        hibernationMultiplier = 0.004
        defaultControlPointDisplayName = Default
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.02
        }
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }
    MODULE
    {
        name = ModuleReactionWheel
        // Strong enough to swing the 21 m, 27.5 t missile round at about 7°/s² in pitch and yaw
        // (gameplay choice; the canards do most of the steering at speed).
        PitchTorque = 120
        YawTorque = 120
        RollTorque = 30
        RESOURCE
        {
            name = ElectricCharge
            rate = 1.2
        }
    }
    // Built-in antenna, so the missile keeps a CommNet connection and stays under control.
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = INTERNAL
        packetInterval = 1.0
        packetSize = 2
        packetResourceCost = 12.0
        requiredResource = ElectricCharge
        antennaPower = 5000
        optimumRange = 2500
        packetFloor = .1
        packetCeiling = 5
    }
    MODULE
    {
        name = ModuleKerbNetAccess
        MinimumFoV = 13
        MaximumFoV = 87
        AnomalyDetection = 0
        DISPLAY_MODES
        {
            Mode = Terrain,#autoLOC_438839
        }
    }

    // Integrated boosters: SolidFuel, staged.
    MODULE
    {
        name = ModuleEnginesFX
        engineID = Boost
        thrustVectorTransformName = boostThrust
        throttleLocked = True
        exhaustDamage = True
        allowShutdown = False
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 1500
        heatProduction = 200
        fxOffset = 0, 0, 0.1
        EngineType = SolidBooster
        runningEffectName = boostRunning
        stagingEnabled = True
        PROPELLANT
        {
            name = SolidFuel
            ratio = 1.0
            DrawGauge = True
        }
        atmosphereCurve
        {
            key = 0 240
            key = 1 220
            key = 7 0.001
        }
    }

    // Nuclear ramjet: rammed air only, started by the plugin at booster burnout.
    MODULE
    {
        name = ModuleEnginesFX
        engineID = Ramjet
        thrustVectorTransformName = ramjetThrust
        exhaustDamage = True
        ignitionThreshold = 0.1
        minThrust = 0
        // Rated thrust is set every frame by the reactor plugin from ramjet physics.
        maxThrust = 280
        heatProduction = 120
        // No spool lag here: the reactor's own power ramp is the engine's response time.
        useEngineResponseTime = False
        useVelCurve = False
        useAtmCurve = False
        EngineType = Turbine
        runningEffectName = ramjetRunning
        stagingEnabled = False
        PROPELLANT
        {
            name = IntakeAir
            ignoreForIsp = True
            ratio = 1
            DrawGauge = True
        }
        atmosphereCurve
        {
            key = 0 4500 0 0
        }
    }
    MODULE
    {
        name = ModuleGimbal
        gimbalTransformName = ramjetThrust
        gimbalRange = 3
        useGimbalResponseSpeed = True
        gimbalResponseSpeed = 8
    }
    MODULE
    {
        name = ModuleResourceIntake
        resourceName = IntakeAir
        checkForOxygen = True
        area = 0.03
        intakeSpeed = 15
        intakeTransformName = Intake
        machCurve
        {
            key = 1 1 0 0
            key = 4 0.9 -0.1 -0.1
            key = 6 0.5 0 0
        }
    }

    // Lift from the long body (pitch plane), the three fixed tail fins, and three moving canards
    // for steering. Sized so the 27.5 t missile can hold level flight low down at about Mach 0.8
    // with a few degrees of angle of attack; at Mach 3 it needs barely any.
    MODULE
    {
        name = ModuleLiftingSurface
        useInternalDragModel = False
        deflectionLiftCoeff = 4.0
        dragAtMaxAoA = 0.4
        dragAtMinAoA = 0.0
        transformName = Body
    }
    MODULE
    {
        name = ModuleLiftingSurface
        useInternalDragModel = False
        deflectionLiftCoeff = 0.6
        dragAtMaxAoA = 0.3
        dragAtMinAoA = 0.0
        transformName = Fin1
    }
    MODULE
    {
        name = ModuleLiftingSurface
        useInternalDragModel = False
        deflectionLiftCoeff = 0.6
        dragAtMaxAoA = 0.3
        dragAtMinAoA = 0.0
        transformName = Fin2
    }
    MODULE
    {
        name = ModuleLiftingSurface
        useInternalDragModel = False
        deflectionLiftCoeff = 0.6
        dragAtMaxAoA = 0.3
        dragAtMinAoA = 0.0
        transformName = Fin3
    }
    MODULE
    {
        name = ModuleControlSurface
        useInternalDragModel = False
        transformName = Canard1
        ctrlSurfaceRange = 15
        ctrlSurfaceArea = 1
        deflectionLiftCoeff = 0.25
        actuatorSpeed = 40
    }
    MODULE
    {
        name = ModuleControlSurface
        useInternalDragModel = False
        transformName = Canard2
        ctrlSurfaceRange = 15
        ctrlSurfaceArea = 1
        deflectionLiftCoeff = 0.25
        actuatorSpeed = 40
    }
    MODULE
    {
        name = ModuleControlSurface
        useInternalDragModel = False
        transformName = Canard3
        ctrlSurfaceRange = 15
        ctrlSurfaceArea = 1
        deflectionLiftCoeff = 0.25
        actuatorSpeed = 40
    }

    MODULE
    {
        name = ModulePlutoBoosters
        boostEngineID = Boost
        boosterDryMass = 3
    }

    MODULE
    {
        name = ModulePlutoReactor
        ramjetEngineID = Ramjet
        electricRate = 5
        // Ideal-ramjet thrust × this, to make up for KSP's drag being far higher than a real missile's.
        // At 1.5: about 190 kN at Mach 0.8 and 440 kN at Mach 3, at sea level.
        thrustMultiplier = 1.5
    }

    MODULE
    {
        name = ModulePlutoWarheads
        hatchTransform = warheadHatch
        autoReleaseSeconds = 60
    }

    MODULE
    {
        name = ModulePlutoAutopilot
        pitchSign = 1
        rollSign = 1
    }

    // Keep last: puts the stock modules' menu rows into one collapsed group.
    MODULE
    {
        name = ModulePlutoMenu
        ramjetEngineID = Ramjet
    }

    EFFECTS
    {
        boostRunning
        {
            AUDIO
            {
                channel = Ship
                clip = sound_rocket_hard
                volume = 0.0 0.0
                volume = 1.0 1.0
                pitch = 0.0 0.2
                pitch = 1.0 1.0
                loop = true
            }
            PREFAB_PARTICLE
            {
                prefabName = fx_smokeTrail_veryLarge
                transformName = boostThrust
                emission = 0.0 0.0
                emission = 0.05 0.0
                emission = 0.075 0.25
                emission = 1.0 1.25
                speed = 0.0 0.25
                speed = 1.0 1.0
                localOffset = 0, 0, 1
            }
            MODEL_MULTI_PARTICLE
            {
                modelName = Squad/FX/SRB_Large
                transformName = boostThrust
                emission = 0.0 0.0
                emission = 0.05 0.0
                emission = 0.075 0.25
                emission = 1.0 1.25
                speed = 0.0 0.5
                speed = 1.0 1.2
            }
        }
        ramjetRunning
        {
            AUDIO
            {
                channel = Ship
                clip = sound_jet_deep
                volume = 0.0 0.0
                volume = 0.05 0.6
                volume = 1.0 1.0
                pitch = 0.0 0.6
                pitch = 1.0 1.0
                loop = true
            }
            MODEL_MULTI_PARTICLE
            {
                // Hot air (≈1,100 °C) leaving supersonic: faint red shock diamonds that grow with thrust.
                modelName = Squad/FX/shockExhaust_red_small
                transformName = ramjetThrust
                emission = 0.0 0.0
                emission = 0.1 0.0
                emission = 0.3 0.35
                emission = 1.0 0.9
                speed = 0.0 0.5
                speed = 1.0 1.0
            }
        }
    }
}
