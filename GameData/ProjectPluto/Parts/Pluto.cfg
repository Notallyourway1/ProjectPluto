PART
{
    name = projectPlutoSLAM
    module = Part
    author = Project Pluto mod

    MODEL
    {
        model = ProjectPluto/Parts/Assets/PlutoExterior
    }
    rescaleFactor = 1
    node_stack_bottom = 0, -13.45, 0, 0, -1, 0, 1
    node_attach = 0, 0, 0.75, 0, 0, 1, 1
    attachRules = 1,1,0,0,0
    bulkheadProfiles = size1, srf

    TechRequired = nuclearPropulsion
    entryCost = 40000
    cost = 45000
    category = Engine
    subcategory = 0
    title = Project Pluto SLAM
    manufacturer = Livermore / Ling-Temco-Vought (depiction)
    description = SLAM, the Supersonic Low Altitude Missile, was the U.S. Air Force cruise missile of Project Pluto (1957–1964). A 600 MW unshielded reactor heated rammed air to push it at Mach 3 at tree-top height or Mach 4.2 at altitude, for a range of 182,000 km. Only the engine was built: Tory II-C ran at full power for 292 seconds in Nevada on 20 May 1964, and the project was cancelled on 1 July 1964. This part depicts the missile as it might have flown; booster count, reactor timing, radiation and warhead effects are gameplay choices.
    tags = pluto slam nuclear ramjet missile tory

    // 19.5 t missile + 8 t warheads (16 × 0.5 t) + 3 t empty boosters. Real launch mass: 27.5 t without boosters.
    mass = 30.5
    dragModelType = default
    maximum_drag = 0.2
    minimum_drag = 0.2
    angularDrag = 1
    crashTolerance = 12
    breakingForce = 400
    breakingTorque = 400
    maxTemp = 2000
    skinMaxTemp = 2400
    emissiveConstant = 0.9
    explosionPotential = 0.4
    vesselType = Probe

    RESOURCE
    {
        name = SolidFuel
        amount = 1700
        maxAmount = 1700
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 200
        maxAmount = 200
    }
    RESOURCE
    {
        name = IntakeAir
        amount = 10
        maxAmount = 10
    }

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        defaultControlPointDisplayName = Default
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.02
        }
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 3
    }
    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 10
        YawTorque = 10
        RollTorque = 10
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.3
        }
    }
    MODULE
    {
        name = ModuleKerbNetAccess
        MinimumFoV = 13
        MaximumFoV = 87
        AnomalyDetection = 0
        DISPLAY_MODES
        {
            Mode = Terrain,#autoLOC_438839
        }
    }

    // Integrated boosters: SolidFuel, staged.
    MODULE
    {
        name = ModuleEnginesFX
        engineID = Boost
        thrustVectorTransformName = boostThrust
        throttleLocked = True
        exhaustDamage = True
        allowShutdown = False
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 1500
        heatProduction = 200
        fxOffset = 0, 0, 0.1
        EngineType = SolidBooster
        runningEffectName = boostRunning
        stagingEnabled = True
        PROPELLANT
        {
            name = SolidFuel
            ratio = 1.0
            DrawGauge = True
        }
        atmosphereCurve
        {
            key = 0 240
            key = 1 220
            key = 7 0.001
        }
    }

    // Nuclear ramjet: rammed air only, started by the plugin at booster burnout.
    MODULE
    {
        name = ModuleEnginesFX
        engineID = Ramjet
        thrustVectorTransformName = ramjetThrust
        exhaustDamage = True
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 170
        heatProduction = 120
        useEngineResponseTime = True
        engineAccelerationSpeed = 0.5
        engineDecelerationSpeed = 1.0
        useVelCurve = True
        useAtmCurve = True
        EngineType = Turbine
        runningEffectName = ramjetRunning
        stagingEnabled = False
        PROPELLANT
        {
            name = IntakeAir
            ignoreForIsp = True
            ratio = 1
            DrawGauge = True
        }
        atmosphereCurve
        {
            key = 0 4500 0 0
        }
        // Mach number → thrust multiplier: nothing at low speed, peak at Mach 3–4.
        velCurve
        {
            key = 0 0 0 0
            key = 0.8 0.05 0.15 0.15
            key = 1.5 0.4 0.6 0.6
            key = 3 1 0.1 0.1
            key = 4.2 0.9 -0.3 -0.3
            key = 5.5 0.2 -0.5 -0.5
            key = 6.5 0 0 0
        }
        // Atmospheric density (kg/m³) → thrust multiplier.
        atmCurve
        {
            key = 0 0 0 0
            key = 0.05 0.15 3 3
            key = 0.3 0.6 1.2 1.2
            key = 1 1 0.3 0
        }
    }
    MODULE
    {
        name = ModuleGimbal
        gimbalTransformName = ramjetThrust
        gimbalRange = 3
        useGimbalResponseSpeed = True
        gimbalResponseSpeed = 8
    }
    MODULE
    {
        name = ModuleResourceIntake
        resourceName = IntakeAir
        checkForOxygen = True
        area = 0.03
        intakeSpeed = 15
        intakeTransformName = Intake
        machCurve
        {
            key = 1 1 0 0
            key = 4 0.9 -0.1 -0.1
            key = 6 0.5 0 0
        }
    }

    // Lift from the long body (pitch plane) and three moving canards for steering.
    MODULE
    {
        name = ModuleLiftingSurface
        useInternalDragModel = False
        deflectionLiftCoeff = 1.5
        dragAtMaxAoA = 0.4
        dragAtMinAoA = 0.0
        transformName = Body
    }
    MODULE
    {
        name = ModuleControlSurface
        useInternalDragModel = False
        transformName = Canard1
        ctrlSurfaceRange = 15
        ctrlSurfaceArea = 1
        deflectionLiftCoeff = 0.25
        actuatorSpeed = 40
    }
    MODULE
    {
        name = ModuleControlSurface
        useInternalDragModel = False
        transformName = Canard2
        ctrlSurfaceRange = 15
        ctrlSurfaceArea = 1
        deflectionLiftCoeff = 0.25
        actuatorSpeed = 40
    }
    MODULE
    {
        name = ModuleControlSurface
        useInternalDragModel = False
        transformName = Canard3
        ctrlSurfaceRange = 15
        ctrlSurfaceArea = 1
        deflectionLiftCoeff = 0.25
        actuatorSpeed = 40
    }

    MODULE
    {
        name = ModulePlutoBoosters
        boostEngineID = Boost
        boosterDryMass = 3
    }

    MODULE
    {
        name = ModulePlutoReactor
        ramjetEngineID = Ramjet
        electricRate = 5
    }

    MODULE
    {
        name = ModulePlutoWarheads
        hatchTransform = warheadHatch
        autoReleaseSeconds = 60
    }

    EFFECTS
    {
        boostRunning
        {
            AUDIO
            {
                channel = Ship
                clip = sound_rocket_hard
                volume = 0.0 0.0
                volume = 1.0 1.0
                pitch = 0.0 0.2
                pitch = 1.0 1.0
                loop = true
            }
            PREFAB_PARTICLE
            {
                prefabName = fx_smokeTrail_veryLarge
                transformName = boostThrust
                emission = 0.0 0.0
                emission = 0.05 0.0
                emission = 0.075 0.25
                emission = 1.0 1.25
                speed = 0.0 0.25
                speed = 1.0 1.0
                localOffset = 0, 0, 1
            }
            MODEL_MULTI_PARTICLE
            {
                modelName = Squad/FX/SRB_Large
                transformName = boostThrust
                emission = 0.0 0.0
                emission = 0.05 0.0
                emission = 0.075 0.25
                emission = 1.0 1.25
                speed = 0.0 0.5
                speed = 1.0 1.2
            }
        }
        ramjetRunning
        {
            AUDIO
            {
                channel = Ship
                clip = sound_jet_deep
                volume = 0.0 0.0
                volume = 0.05 0.6
                volume = 1.0 1.0
                pitch = 0.0 0.6
                pitch = 1.0 1.0
                loop = true
            }
            MODEL_MULTI_PARTICLE
            {
                modelName = Squad/FX/shockExhaust_blue_small
                transformName = ramjetThrust
                emission = 0.0 0.0
                emission = 0.05 0.0
                emission = 0.075 0.25
                emission = 1.0 1.0
                speed = 0.0 0.5
                speed = 1.0 1.0
            }
        }
    }
}
